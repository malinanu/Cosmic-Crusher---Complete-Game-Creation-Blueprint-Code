name: Deploy AstroSpin to CloudPanel

on:
  push:
    branches:
      - main
      - sector-2
      - claude/intelligent-ramanujan-5xw0c8
  workflow_dispatch:

concurrency:
  group: deploy-cloudpanel
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy Web Bundle
    runs-on: ubuntu-latest
    environment: CLOUDPANEL_STAGING

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow==12.3.0

      - name: Build Web Production Distribution
        run: python3 tools/build.py web

      - name: Verify game levels
        run: node tools/check_levels.js

      - name: Configure SSH key
        run: |
          if [ -z "${{ secrets.CLOUDPANEL_HOST }}" ]; then
            echo "Error: CLOUDPANEL_HOST secret is missing or empty."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.CLOUDPANEL_SSH_KEY }}" > ~/.ssh/cloudpanel_key
          chmod 600 ~/.ssh/cloudpanel_key
          ssh-keyscan -p ${{ secrets.CLOUDPANEL_PORT || '22' }} ${{ secrets.CLOUDPANEL_HOST }} >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy to CloudPanel via rsync
        run: |
          rsync -avz --delete \
            --exclude='.user.ini' \
            --exclude='.well-known' \
            --exclude='.htaccess' \
            -e "ssh -i ~/.ssh/cloudpanel_key -p ${{ secrets.CLOUDPANEL_PORT || '22' }} -o StrictHostKeyChecking=accept-new" \
            dist/web/ ${{ secrets.CLOUDPANEL_USER }}@${{ secrets.CLOUDPANEL_HOST }}:${{ secrets.CLOUDPANEL_TARGET_DIR }}/
