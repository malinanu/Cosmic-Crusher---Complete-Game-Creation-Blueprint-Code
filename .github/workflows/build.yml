name: Build

# On every push: build and test the YouTube Playables bundle, build the
# Android app (debug APK + unsigned release AAB), and compile the iOS app for
# the simulator. Downloads are under each run's "Artifacts".

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  web:
    name: YouTube bundle + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install pillow==12.3.0
      - run: python3 tools/build.py all
      - run: node tools/check_levels.js
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - run: node tools/smoke_test.js
      - uses: actions/upload-artifact@v4
        with:
          name: youtube-playables-bundle
          path: dist/cosmic-crusher-youtube.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-screenshots
          path: tools/out/

  browsers:
    # YouTube supports Chrome, Edge, Firefox and its iOS app (WebKit).
    name: YouTube checks on ${{ matrix.browser }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install pillow==12.3.0
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps ${{ matrix.browser }}
      - run: node tools/smoke_test.js --browser=${{ matrix.browser }} --only=youtube

  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: pip install pillow==12.3.0
      - run: python3 tools/build.py mobile
      - name: Sync Capacitor
        working-directory: mobile
        run: |
          npm ci
          npx cap sync android
      - name: Build APK and AAB
        working-directory: mobile/android
        run: ./gradlew assembleDebug bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-aab-unsigned
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab

  ios:
    name: iOS app (simulator build)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: pip install pillow==12.3.0
      - run: python3 tools/build.py mobile
      - name: Sync Capacitor
        working-directory: mobile
        run: |
          npm ci
          npx cap sync ios
      - name: Use the newest Xcode on the runner
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)" && xcodebuild -version
      - name: Build for the iOS simulator (no signing)
        working-directory: mobile/ios/App
        run: >
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
